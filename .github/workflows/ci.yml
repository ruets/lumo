name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build --filter=@lumo/api --filter=@lumo/web --filter='./packages/*'
      # La spec OpenAPI à jour sera vérifiée ici dès qu'elle existera (étape 2).

  docker:
    name: Image Docker et scan Trivy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lumo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (le conteneur démarre et répond)
        run: |
          docker run -d --name lumo-smoke -p 3000:3000 \
            -e PUBLIC_URL=http://localhost:3000 \
            -e SESSION_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            lumo:ci
          for i in $(seq 1 30); do
            curl -fsS http://localhost:3000/readyz && exit 0
            sleep 1
          done
          docker logs lumo-smoke
          exit 1
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lumo:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
