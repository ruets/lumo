name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Includes the OpenAPI freshness check (apps/api/src/openapi.test.ts) and the mobile offline-queue tests.
      - run: pnpm test
      - run: pnpm build --filter=@lumo/api --filter=@lumo/web --filter='./packages/*'

  docker:
    name: Docker image (web + API), smoke test and Trivy scan
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: lumo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (the container starts, serves the web app and answers the API)
        run: |
          docker run -d --name lumo-smoke -p 3000:3000 \
            -e PUBLIC_URL=http://localhost:3000 \
            -e SESSION_SECRET=ci-secret-ci-secret-ci-secret-ci-secret \
            lumo:ci
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:3000/readyz >/dev/null; then
              curl -fsS http://localhost:3000/ | grep -q 'id="root"'
              curl -fsS http://localhost:3000/api/v1/auth/config | grep -q '"app":"lumo"'
              exit 0
            fi
            sleep 1
          done
          docker logs lumo-smoke
          exit 1
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: lumo:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  publish:
    name: Publish the image to GHCR
    runs-on: ubuntu-latest
    needs: docker
    # Pull requests never publish. Every push to main gives `edge` and the commit SHA; a v*.*.* tag gives
    # the SemVer tags and `latest`.
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=edge,branch=main
            type=sha
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
