# Lumo : app (API + web + tâches) et sauvegarde Litestream.
# Usage : cp .env.example .env && docker compose up -d
services:
  app:
    image: ghcr.io/${LUMO_IMAGE_OWNER:-OWNER}/lumo:${LUMO_VERSION:-latest}
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_PATH: /data/lumo.db
    volumes:
      - lumo-data:/data
    ports:
      - "${LUMO_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  backup:
    image: litestream/litestream:0.3.13
    restart: unless-stopped
    command: replicate
    env_file: .env
    volumes:
      - lumo-data:/data
      - ./litestream.yml:/etc/litestream.yml:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  lumo-data:
