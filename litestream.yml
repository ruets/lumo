# Continuous replication of /data/lumo.db + daily snapshot, kept for 7 days.
# The destination comes from .env: LITESTREAM_REPLICA_URL (e.g. s3://bucket/lumo, or
# sftp://user@host/path) and, for S3, LITESTREAM_ACCESS_KEY_ID / LITESTREAM_SECRET_ACCESS_KEY.
dbs:
  - path: /data/lumo.db
    replicas:
      - url: ${LITESTREAM_REPLICA_URL}
        snapshot-interval: 24h
        retention: 168h
